services:
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      backend:
        condition: service_started
      admin:
        condition: service_started
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend:/var/www/html
    networks:
      - v2net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    working_dir: /var/www/html
    command: sh -c "if [ ! -f .env ]; then cp .env.example .env; fi && composer install --no-interaction && php artisan key:generate --force && php-fpm"
    env_file:
      - .env
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - v2net

  queue:
    build:
      context: ./backend
      dockerfile: Dockerfile
    working_dir: /var/www/html
    command: sh -c "if [ ! -f .env ]; then cp .env.example .env; fi && composer install --no-interaction && php artisan queue:work --tries=3 --timeout=120"
    env_file:
      - .env
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - v2net

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    working_dir: /var/www/html
    command: sh -c "if [ ! -f .env ]; then cp .env.example .env; fi && composer install --no-interaction && while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    env_file:
      - .env
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - v2net

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    volumes:
      - ./admin:/app
      - admin_node_modules:/app/node_modules
    networks:
      - v2net

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: formular_v2
      POSTGRES_USER: formular
      POSTGRES_PASSWORD: formular
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U formular -d formular_v2"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - v2net

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - v2net

networks:
  v2net:
    driver: bridge

volumes:
  pgdata:
  admin_node_modules:
  backend_vendor: